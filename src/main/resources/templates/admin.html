
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员工作台 - Web漏洞实验教学平台</title>

    <link rel="stylesheet" href="/css/design-tokens.css">




    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
        }

        .header {
            height: 68px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 1px solid #e8edf5;
        }

        .brand {
            font-size: 19px;
            font-weight: bold;
            color: #2563eb;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 14px;
        }

        .logout-button {
            border: none;
            background: #eff6ff;
            color: #2563eb;
            padding: 9px 18px;
            border-radius: 7px;
            cursor: pointer;
            transition: 0.2s;
        }

        .logout-button:hover {
            background: #dbeafe;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #172554;
        }

        .welcome p {
            color: #64748b;
            font-size: 14px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 18px;
            color: #172554;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            border: 1px solid #edf0f5;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 3px 15px rgba(15, 23, 42, 0.03);
        }

        .stat-label {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .menu-card {
            position: relative;
            display: block;
            min-height: 175px;
            padding: 25px;
            background: white;
            border: 1px solid #e8edf5;
            border-radius: 13px;
            color: inherit;
            box-shadow: 0 3px 15px rgba(15, 23, 42, 0.03);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            border-color: #bfdbfe;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.09);
        }

        .menu-card h3 {
            font-size: 17px;
            margin-bottom: 12px;
            color: #172554;
        }

        .menu-card p {
            font-size: 13px;
            line-height: 1.8;
            color: #64748b;
        }

        .menu-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            padding: 6px 11px;
            border-radius: 6px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 12px;
            font-weight: 600;
        }

        .menu-status::after {
            content: "→";
            font-size: 14px;
        }

        .page-footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            padding: 35px 0;
        }

        @media (max-width: 800px) {
            .stat-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 0 18px;
            }
        }

        @media (max-width: 450px) {
            .stat-grid {
                grid-template-columns: 1fr;
            }

            .brand {
                font-size: 15px;
            }

            .user-area {
                gap: 8px;
                font-size: 12px;
            }

            .container {
                margin-top: 25px;
            }
        }




        /* 管理员工作台统一视觉优化 */

body {
    background: var(--color-page-bg);
    color: var(--color-text-primary);
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
}

.header {
    border-bottom: 1px solid var(--color-border);
    box-shadow: var(--shadow-sm);
}

.stat-card,
.menu-card {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    transition: var(--transition-normal);
}

.stat-card:hover,
.menu-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
}

.menu-card {
    display: block;
    color: inherit;
    text-decoration: none;
}

.menu-card h3 {
    color: var(--color-text-primary);
}

.menu-card p {
    color: var(--color-text-secondary);
}

.menu-card:hover h3 {
    color: var(--color-primary);
}

.menu-status {
    border-radius: 20px;
    background: var(--color-primary-light);
    color: var(--color-primary);
    font-weight: 600;
}

.logout-button {
    border-radius: var(--radius-sm);
    transition: var(--transition-fast);
}

.logout-button:hover {
    background: #dbeafe;
}

@media (max-width: 650px) {
    .header {
        padding: 0 15px;
    }

    .container {
        margin-top: 25px;
    }

    .welcome h1 {
        font-size: 23px;
    }

    .stat-grid {
        gap: 12px;
    }

    .stat-card,
    .menu-card {
        padding: 19px;
    }
}
    </style>
</head>

<body>

<header class="header">
    <div class="brand">Web漏洞实验教学平台</div>

    <div class="user-area">
        <span id="adminName">管理员</span>
        <button class="logout-button" id="logoutButton">
            退出登录
        </button>
    </div>
</header>

<main class="container">

    <section class="welcome">
        <h1>管理员工作台</h1>
        <p>欢迎使用 Web 漏洞实验教学平台管理系统。</p>
    </section>

    <h2 class="section-title">平台数据概览</h2>

    <section class="stat-grid">

        <div class="stat-card">
            <div class="stat-label">平台用户总数</div>
            <div class="stat-value" id="userCount">--</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">实验资源总数</div>
            <div class="stat-value" id="experimentCount">--</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">漏洞知识总数</div>
            <div class="stat-value" id="vulnerabilityCount">--</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">待审核报告</div>
            <div class="stat-value" id="pendingCount">--</div>
        </div>

    </section>

    <h2 class="section-title">平台管理功能</h2>

    <section class="menu-grid">

        <!-- 用户管理 -->
        <a class="menu-card" href="/admin/users">
            <h3>用户管理</h3>
            <p>查看平台用户信息，管理学生账号状态及用户角色。</p>
            <span class="menu-status">进入管理</span>
        </a>

        <!-- 实验资源管理 -->
        <a class="menu-card" href="/admin/experiments">
            <h3>实验资源管理</h3>
            <p>维护实验资源，配置实验名称、难度、实验步骤及靶场入口。</p>
            <span class="menu-status">进入管理</span>
        </a>

        <!-- 漏洞知识管理 -->
        <a class="menu-card" href="/admin/knowledge">
            <h3>漏洞知识管理</h3>
            <p>维护漏洞知识内容，管理漏洞分类及教学资料。</p>
            <span class="menu-status">进入管理</span>
        </a>

        <!-- 实验报告审核 -->
        <a class="menu-card" href="/admin/submissions">
            <h3>实验报告审核</h3>
            <p>查看学生提交的实验报告，进行审核、评分及评语反馈。</p>
            <span class="menu-status">进入管理</span>
        </a>

    </section>

</main>

<footer class="page-footer">
    基于 Java Web 的 Web 漏洞实验教学平台
</footer>

<script src="/js/admin.js"></script>

</body>
</html>
